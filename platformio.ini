; 8Bit-Vintage — ATtiny85 sound applications for the 8Bit Mixtape
; https://github.com/8BitMixtape/8Bit-Vintage
;
; Build:   pio run
; Upload:  pio run --target upload   (plays the WAV — power-cycle the ATtiny
;                                     into the AudioBoot bootloader first)

[platformio]
description = ATtiny85 sound applications with audio (WAV) upload for the 8Bit Mixtape

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 16000000L
build_flags =
        -DF_CPU=16000000L
        -DARDUINO_AVR_ATTINYX5
        -DCLOCK_SOURCE=8
lib_deps =
    adafruit/Adafruit NeoPixel
; Prefer vendored libraries under lib/ over remote deps
lib_ldf_mode = chain+

; --- hex -> wav pipeline -------------------------------------------------
extra_scripts =
        scripts/hex2wav_post.py
; hex2wav converter per OS:
;   - Linux 64-bit:   tools/hex2wav/linux/hex2wav64_bin {hex} {wav}
;   - Linux 32-bit:   tools/hex2wav/linux/hex2wav32_bin {hex} {wav}
;   - macOS:          tools/hex2wav/macosx/hex2wav {hex} {wav}
;   - Windows:        tools/hex2wav/windows/hex2wav.exe {hex} {wav}
;   - Java (any OS):  java -jar tools/hex2wav/hex2wav.jar -i {hex} -o {wav}
custom_hex2wav_cmd = tools/hex2wav/linux/hex2wav64_bin {hex} {wav}
custom_hex2wav_auto_play = no
custom_hex2wav_player_cmd = aplay -q {wav}
upload_protocol = custom
upload_command = tools/hex2wav/linux/hex2wav64_bin $SOURCE .pio/build/${PIOENV}/${PROGNAME}.wav && aplay -q .pio/build/${PIOENV}/${PROGNAME}.wav

; --- Sketch selection ----------------------------------------------------
; Select exactly ONE main file:
build_src_filter =
    -<*>
